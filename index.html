<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts and ideas quickly</p>
  </header>

  <!-- Main Content Area -->
  <main>
    <!-- Section 1: Add a note -->
    <section id="add-note-section">
      <h2>Add a Note</h2>
      <form id="note-form">
        <div class="form-group flex-grow">
          <label for="note-input">Note Content</label>
          <input 
            type="text" 
            id="note-input" 
            placeholder="Type your note here..." 
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Note</button>
      </form>

      <p id="error-message" role="alert"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section id="your-notes-section">
      <h2>Your Notes</h2>
      
      <div class="search-container">
        <label for="search-input" class="sr-only">Search notes</label>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search notes..."
        >
      </div>

      <p id="note-count">Total notes: 0</p>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <!-- Footer Section -->
  <footer>
    <p>&copy; 2026 QuickNotes App. Built for productivity.</p>
  </footer>

</body>
</html>
